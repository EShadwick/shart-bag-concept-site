# Local development environment: the same site and API that run in AWS,
# with DynamoDB Local standing in for DynamoDB. Nothing here touches AWS.
#
#   docker compose up --build        -> http://localhost:8080
#   docker compose down              -> stop and remove everything

name: shart-bag

services:
  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: shart-bag-api:local
    build:
      context: ./api
      args:
        NODE_VERSION: "${NODE_VERSION:-24}"
    environment:
      TABLE_NAME: shart-bag-feedback-local
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      AWS_REGION: us-east-1
      # DynamoDB Local accepts any credentials; these are not real keys.
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    depends_on:
      - dynamodb

  dynamodb:
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
