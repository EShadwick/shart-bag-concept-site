name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm test

  site:
    name: Site asset check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/check-site.mjs

  terraform:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.5"
      - run: terraform fmt -check -recursive infra
      - name: Validate bootstrap
        working-directory: infra/bootstrap
        run: terraform init -backend=false -input=false && terraform validate
      - name: Validate preview
        working-directory: infra/preview
        run: terraform init -backend=false -input=false && terraform validate
      - name: Validate server
        working-directory: infra/server
        run: terraform init -backend=false -input=false && terraform validate

  compose:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: [api, site]
    steps:
      - uses: actions/checkout@v7
      - name: Start the local stack
        run: docker compose up -d --build --wait
      - name: Site, film and video are served
        run: |
          curl -fsS -o /dev/null http://localhost:8080/
          curl -fsS -o /dev/null http://localhost:8080/film.html
          curl -fsS -o /dev/null http://localhost:8080/media/golf.mp4
      - name: Feedback API saves a valid submission and rejects a bad one
        run: |
          curl -fsS http://localhost:8080/api/health
          curl -fsS -X POST http://localhost:8080/api/feedback \
            -H 'content-type: application/json' \
            -d '{"name":"CI","comments":"Smoke test","favoriteBag":"midnight-black","favoriteCharm":"skid-mark","wouldBuy":"maybe"}' \
            | grep -q '"saved"'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/feedback \
            -H 'content-type: application/json' -d '{"name":""}')
          test "$code" = "400"
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down -v

  server:
    name: Server scripts and origin gate
    runs-on: ubuntu-latest
    needs: [api, site]
    env:
      ORIGIN_SECRET: ci-origin-secret
      TABLE_NAME: ci-not-used
      AWS_REGION: us-east-1
      HTTP_PORT: "8081"
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: |
          command -v shellcheck > /dev/null || sudo apt-get install -y shellcheck
          shellcheck deploy/server/*.sh scripts/*.sh
      - name: Start the server stack
        run: docker compose -f deploy/server/compose.yml up -d --build --wait
      - name: nginx only answers requests that carry the CloudFront origin secret
        run: |
          status() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          ok=(-H "X-Origin-Verify: $ORIGIN_SECRET")
          test "$(status http://localhost:8081/)" = "403"
          test "$(status -H 'X-Origin-Verify: wrong' http://localhost:8081/)" = "403"
          test "$(status "${ok[@]}" http://localhost:8081/)" = "200"
          test "$(status "${ok[@]}" http://localhost:8081/media/golf.mp4)" = "200"
          test "$(status "${ok[@]}" http://localhost:8081/api/health)" = "200"
          test "$(status http://localhost:8081/api/health)" = "403"
          test "$(status "${ok[@]}" http://localhost:8081/healthz)" = "403"
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/server/compose.yml logs
      - name: Stop
        if: always()
        run: docker compose -f deploy/server/compose.yml down -v
